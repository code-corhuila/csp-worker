name: ci

on:
  pull_request:
    branches: [develop, qa, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: mvn -B verify
      # The jar of worker-app must start on its own: without the repackaging it has no main class and
      # the container cannot run, and nothing else would fail.
      - name: The jar is executable
        run: |
          unzip -p worker-app/target/worker-app-0.1.0.jar META-INF/MANIFEST.MF | grep -q '^Main-Class: org.springframework.boot.loader'
