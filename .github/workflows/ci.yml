name: ci

on:
  pull_request:
    branches: [develop, qa, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: mvn -B verify
      # The jar of worker-app must start on its own: without the repackaging it has no main class and
      # the container cannot run, and nothing else would fail.
      - name: The jar is executable
        run: |
          unzip -p worker-app/target/worker-app-0.1.0.jar META-INF/MANIFEST.MF | grep -q '^Main-Class: org.springframework.boot.loader'
      # The image is what csp-infra composes: build it and start it. Without a token the worker must stop
      # with its own message, which proves the jar boots as the unprivileged user and reaches our code.
      - name: The image builds and starts
        run: |
          docker build -f deploy/Dockerfile -t csp-worker:ci .
          if docker run --rm csp-worker:ci > worker.log 2>&1; then
            echo "the worker started without a token"; exit 1
          fi
          grep -q 'SERVICE_TOKEN or SERVICE_TOKEN_FILE is required' worker.log || { cat worker.log; exit 1; }
