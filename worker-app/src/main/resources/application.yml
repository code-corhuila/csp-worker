spring:
  application:
    name: csp-worker
  autoconfigure:
    # The worker opens no database through Spring Boot: the PostgreSQL adapters of the outbox relay receive
    # their own connection. Without this, the JDBC starter tries to build a DataSource from a URL nobody sets.
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

server:
  port: 8080
  shutdown: graceful

worker:
  # Every job has its own flag: the same image runs as the instances the platform needs (see the README).
  expire-holds:
    enabled: ${EXPIRE_HOLDS_ENABLED:true}
    interval-seconds: ${EXPIRE_EVERY:60}
  # Asks the identity service to purge what it no longer needs (HU-AUTH-002, ADR-030). Off until it is wanted.
  purge-auth:
    enabled: ${PURGE_AUTH_ENABLED:false}
    interval-seconds: ${PURGE_EVERY:3600}
    batch-size: ${PURGE_BATCH_SIZE:500}
    run-timeout-seconds: ${PURGE_RUN_TIMEOUT:60}
  # Publishes the booking outbox to RabbitMQ (ADR-014). Off until the platform has a broker.
  outbox-relay:
    enabled: ${OUTBOX_RELAY_ENABLED:false}
    interval-seconds: ${OUTBOX_RELAY_EVERY:5}
    database:
      url: ${RELAY_DATABASE_URL:}
      username: ${RELAY_DATABASE_USER:worker_app}
      password: ${RELAY_DATABASE_PASSWORD:}
    amqp:
      url: ${RELAY_AMQP_URL:}
      exchange: ${RELAY_AMQP_EXCHANGE:cine.events}
      confirm-timeout-seconds: 5
  # Publishes the auth outbox (ADR-019) with the login and broker above. Off until the consumers exist.
  # Only the listed event types are published: UserRoleChanged has no consumer in the MVP.
  auth-outbox-relay:
    enabled: ${AUTH_OUTBOX_RELAY_ENABLED:false}
    interval-seconds: ${AUTH_OUTBOX_RELAY_EVERY:5}
    event-types: ${AUTH_OUTBOX_RELAY_EVENT_TYPES:UserRegistered,UserEmailChanged}
  # Settles the concession order of a reservation when Booking confirms or expires it (HU-CONCESSIONS-004, ADR-045).
  # It reads the queues of Concessions with the broker login of that service. Off until the broker exists.
  concessions-reservation-events:
    enabled: ${CONCESSIONS_EVENTS_ENABLED:false}
    interval-seconds: ${CONCESSIONS_EVENTS_EVERY:5}
    batch-size: ${CONCESSIONS_EVENTS_BATCH_SIZE:100}
    run-timeout-seconds: ${CONCESSIONS_EVENTS_RUN_TIMEOUT:20}
    amqp:
      url: ${CONCESSIONS_AMQP_URL:}
      exchange: ${CONCESSIONS_AMQP_EXCHANGE:cine.events}
      dead-letter-exchange: ${CONCESSIONS_AMQP_DEAD_LETTER_EXCHANGE:cine.dlx}
  # Asks the concessions service to release the orders without a reservation whose time ran out (HU-CONCESSIONS-004, ADR-045).
  expire-concessions-orders:
    enabled: ${EXPIRE_CONCESSIONS_ORDERS_ENABLED:false}
    interval-seconds: ${EXPIRE_CONCESSIONS_ORDERS_EVERY:60}
    batch-size: ${EXPIRE_CONCESSIONS_ORDERS_BATCH_SIZE:100}
    run-timeout-seconds: ${EXPIRE_CONCESSIONS_ORDERS_RUN_TIMEOUT:60}
  # Publishes the concessions outbox (ADR-019, ADR-045) with the login and broker above. Off until the consumers exist.
  # Only the listed event types are published: Ticketing is the one consumer, of ConcessionOrderConfirmed.
  concessions-outbox-relay:
    enabled: ${CONCESSIONS_OUTBOX_RELAY_ENABLED:false}
    interval-seconds: ${CONCESSIONS_OUTBOX_RELAY_EVERY:5}
    event-types: ${CONCESSIONS_OUTBOX_RELAY_EVENT_TYPES:ConcessionOrderConfirmed}

# Generates PDF tickets for confirmed bookings (Option B: heavy job in csp-worker).
  # It consumes BookingConfirmed events, generates PDF+QR, uploads to object storage,
  # calls ticketing-api internal endpoint, and publishes TicketIssued.
  generate-ticket-pdf:
    enabled: ${GENERATE_TICKET_PDF_ENABLED:false}
    interval-seconds: ${GENERATE_TICKET_PDF_EVERY:30}
    run-timeout-seconds: ${GENERATE_TICKET_PDF_RUN_TIMEOUT:60}
    batch-size: ${GENERATE_TICKET_PDF_BATCH_SIZE:10}
    object-storage:
      url: ${OBJECT_STORAGE_URL:http://minio:9000}
      access-key: ${OBJECT_STORAGE_ACCESS_KEY:minioadmin}
      secret-key: ${OBJECT_STORAGE_SECRET_KEY:minioadmin}
      bucket: ${OBJECT_STORAGE_BUCKET:tickets}
    ticketing-api:
      url: ${TICKETING_API_URL:http://ticketing-api:8084/api/v1/ticketing}
      timeout-seconds: 10
    amqp:
      url: ${RELAY_AMQP_URL:}
      exchange: ${RELAY_AMQP_EXCHANGE:cine.events}
      confirm-timeout-seconds: 5

booking:
  api:
    url: ${BOOKING_API_URL:http://booking-api:8083/api/v1/booking}
    timeout-seconds: 10

auth:
  api:
    url: ${AUTH_API_URL:http://auth-api:8081/api/v1/auth}
    timeout-seconds: 10

concessions:
  api:
    url: ${CONCESSIONS_API_URL:http://concessions-api:8085/api/v1/concessions}
    timeout-seconds: 10

logging:
  level:
    co.edu.corhuila.csp.worker: INFO
