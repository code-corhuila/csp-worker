spring:
  application:
    name: csp-worker

server:
  port: 8080
  shutdown: graceful

worker:
  expire-holds:
    interval-seconds: ${EXPIRE_EVERY:60}

booking:
  api:
    url: ${BOOKING_API_URL:http://booking-api:8083/api/v1/booking}
    timeout-seconds: 10

logging:
  level:
    co.edu.corhuila.csp.worker: INFO
