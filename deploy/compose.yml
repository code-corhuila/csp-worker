# This service only. csp-infra includes this file to compose the platform.
name: csp-worker

services:
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      SERVICE_TOKEN_FILE: ${SERVICE_TOKEN_FILE:-}
      BOOKING_API_URL: ${BOOKING_API_URL:-http://booking-api:8083/api/v1/booking}
      EXPIRE_HOLDS_ENABLED: ${EXPIRE_HOLDS_ENABLED:-true}
      EXPIRE_EVERY: ${EXPIRE_EVERY:-60}
      PURGE_AUTH_ENABLED: ${PURGE_AUTH_ENABLED:-false}
      AUTH_API_URL: ${AUTH_API_URL:-http://auth-api:8081/api/v1/auth}
      PURGE_EVERY: ${PURGE_EVERY:-3600}
      PURGE_BATCH_SIZE: ${PURGE_BATCH_SIZE:-500}
      PURGE_RUN_TIMEOUT: ${PURGE_RUN_TIMEOUT:-60}
      # The outbox relay of booking (ADR-014) stays off until the platform has a RabbitMQ broker to point it at.
      OUTBOX_RELAY_ENABLED: ${OUTBOX_RELAY_ENABLED:-false}
      OUTBOX_RELAY_EVERY: ${OUTBOX_RELAY_EVERY:-5}
      # The outbox relay of auth stays off until the consumers of Ticketing declare their queues (ADR-036).
      AUTH_OUTBOX_RELAY_ENABLED: ${AUTH_OUTBOX_RELAY_ENABLED:-false}
      AUTH_OUTBOX_RELAY_EVERY: ${AUTH_OUTBOX_RELAY_EVERY:-5}
      AUTH_OUTBOX_RELAY_EVENT_TYPES: ${AUTH_OUTBOX_RELAY_EVENT_TYPES:-UserRegistered,UserEmailChanged}
      # The orders of the reservations (HU-CONCESSIONS-004) are settled from the queues of Concessions; it needs the
      # broker login of that service, not the relay's, and stays off until the broker is composed (ADR-036).
      # The outbox relay of concessions stays off until the consumers of Ticketing declare their queues (ADR-036).
      CONCESSIONS_OUTBOX_RELAY_ENABLED: ${CONCESSIONS_OUTBOX_RELAY_ENABLED:-false}
      CONCESSIONS_OUTBOX_RELAY_EVERY: ${CONCESSIONS_OUTBOX_RELAY_EVERY:-5}
      CONCESSIONS_OUTBOX_RELAY_EVENT_TYPES: ${CONCESSIONS_OUTBOX_RELAY_EVENT_TYPES:-ConcessionOrderConfirmed}
      DISPATCH_TICKET_EMAILS_ENABLED: ${DISPATCH_TICKET_EMAILS_ENABLED:-false}
      DISPATCH_TICKET_EMAILS_EVERY: ${DISPATCH_TICKET_EMAILS_EVERY:-30}
      DISPATCH_TICKET_EMAILS_BATCH_SIZE: ${DISPATCH_TICKET_EMAILS_BATCH_SIZE:-50}
      DISPATCH_TICKET_EMAILS_RUN_TIMEOUT: ${DISPATCH_TICKET_EMAILS_RUN_TIMEOUT:-60}
      TICKETING_API_URL: ${TICKETING_API_URL:-http://ticketing-api:8084}
      TICKETING_OUTBOX_RELAY_ENABLED: ${TICKETING_OUTBOX_RELAY_ENABLED:-false}
      TICKETING_OUTBOX_RELAY_EVERY: ${TICKETING_OUTBOX_RELAY_EVERY:-5}
      TICKETING_OUTBOX_RELAY_EVENT_TYPES: ${TICKETING_OUTBOX_RELAY_EVENT_TYPES:-TicketIssued}
      EXPIRE_CONCESSIONS_ORDERS_ENABLED: ${EXPIRE_CONCESSIONS_ORDERS_ENABLED:-false}
      EXPIRE_CONCESSIONS_ORDERS_EVERY: ${EXPIRE_CONCESSIONS_ORDERS_EVERY:-60}
      EXPIRE_CONCESSIONS_ORDERS_BATCH_SIZE: ${EXPIRE_CONCESSIONS_ORDERS_BATCH_SIZE:-100}
      EXPIRE_CONCESSIONS_ORDERS_RUN_TIMEOUT: ${EXPIRE_CONCESSIONS_ORDERS_RUN_TIMEOUT:-60}
      CONCESSIONS_EVENTS_ENABLED: ${CONCESSIONS_EVENTS_ENABLED:-false}
      CONCESSIONS_EVENTS_EVERY: ${CONCESSIONS_EVENTS_EVERY:-5}
      CONCESSIONS_EVENTS_BATCH_SIZE: ${CONCESSIONS_EVENTS_BATCH_SIZE:-100}
      CONCESSIONS_EVENTS_RUN_TIMEOUT: ${CONCESSIONS_EVENTS_RUN_TIMEOUT:-20}
      CONCESSIONS_API_URL: ${CONCESSIONS_API_URL:-http://concessions-api:8085/api/v1/concessions}
      CONCESSIONS_AMQP_URL: ${CONCESSIONS_AMQP_URL:-}
      CONCESSIONS_AMQP_EXCHANGE: ${CONCESSIONS_AMQP_EXCHANGE:-cine.events}
      CONCESSIONS_AMQP_DEAD_LETTER_EXCHANGE: ${CONCESSIONS_AMQP_DEAD_LETTER_EXCHANGE:-cine.dlx}
      RELAY_DATABASE_URL: jdbc:postgresql://postgres:5432/${PG_DATABASE:-csp}
      RELAY_DATABASE_USER: worker_app
      RELAY_DATABASE_PASSWORD: ${WORKER_APP_PASSWORD:-}
      RELAY_AMQP_URL: ${RELAY_AMQP_URL:-}
      RELAY_AMQP_EXCHANGE: ${RELAY_AMQP_EXCHANGE:-cine.events}
    networks:
      - platform
    restart: unless-stopped

  # Creates schema worker, where the relay keeps its publication state (ADR-014). No -db repository owns that
  # schema, so its migration lives in db/. It runs as the instance administrator, never as worker_app, and
  # before the relay is enabled: docker compose --profile tooling run --rm worker-db-migrate
  worker-db-migrate:
    image: flyway/flyway:11.20
    profiles: [tooling]
    volumes:
      - ../db:/migrations:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${PG_DATABASE:?set PG_DATABASE}
      FLYWAY_USER: ${PG_ADMIN_USER:?set PG_ADMIN_USER}
      FLYWAY_PASSWORD: ${PG_ADMIN_PASSWORD:?set PG_ADMIN_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/migrations
      FLYWAY_SCHEMAS: worker
      FLYWAY_DEFAULT_SCHEMA: worker
      FLYWAY_CREATE_SCHEMAS: "true"
    command: ["migrate"]
    networks: [platform]

networks:
  platform:
    name: platform
    external: true
