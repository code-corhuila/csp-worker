# This service only. csp-infra includes this file to compose the platform.
name: csp-worker

services:
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      SERVICE_TOKEN_FILE: ${SERVICE_TOKEN_FILE:-}
      BOOKING_API_URL: ${BOOKING_API_URL:-http://booking-api:8083/api/v1/booking}
      EXPIRE_EVERY: ${EXPIRE_EVERY:-60}
    networks:
      - platform
    restart: unless-stopped

networks:
  platform:
    name: platform
    external: true
